<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载 SGCC.scriptable</title>
</head>
<body>
<h3>点击按钮下载 SGCC.scriptable</h3>
<p>下载后，在「文件」App找到文件，点击即可唤起Scriptable导入</p>
<button id="downloadBtn">下载 SGCC.scriptable</button>

<script>
document.getElementById("downloadBtn").onclick = async function(){
  // 指向你的 SGCC.scriptable 的 jsDelivr CDN地址
  const fileUrl = "https://cdn.jsdelivr.net/gh/ways0210/Loon-Js@master/js/95598/SGCC.scriptable";
  const resp = await fetch(fileUrl);
  const blob = await resp.blob();
  const blobUrl = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = blobUrl;
  a.download = "SGCC.scriptable";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(blobUrl);
};
</script>
</body>
</html>
